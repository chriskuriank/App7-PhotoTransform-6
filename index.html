/* detectVerticalSquash & drawImageIOSFix = are functions that are critical due to a flaw in the iPhone camera software that squishes any photos displayed on an HTML5 canvas element. https://github.com/stomita/ios-imagefile-megapixel
*/
 function detectVerticalSquash(img) { //ensures the picture is not squished. 
       var iw = img.naturalWidth, ih = img.naturalHeight; //creates a variable and understands what each variable means. 
       var canvas = document.createElement('canvas'); //creates a variable to call later
             canvas.width = 1;  //defines the width
             canvas.height = ih; //defines the height
       var ctx = canvas.getContext('2d'); 
  ctx.drawImage(img, 0, 0); //the canvas is created
          var data = ctx.getImageData(0, 0, 1, ih).data;  // The RBG is defined for the pixel
          var sy = 0; //sy means the starting position
          var ey = ih; //ey means the ending position
          var py = ih; //py means the testing position
     while (py > sy) {
         var alpha = data[(py - 1) * 4 + 3];
     if (alpha === 0) {
         ey = py; 
     } 
   else {
         sy = py;
   }
      py = (ey + sy) >> 1; //this creates the temporary pixel position helping understand the first pixel's beginning position. This is done by an if statement by mentioning how if the beginning position is 0, the squish starts above and move ey upward. Otherwise the pixel is normal and the sy can move downward. 
  }
  var ratio = (py / ih);
  return (ratio===0)?1:ratio; //helps understand how much to squish it by
 }

 function drawImageIOSFix(ctx, img, sx, sy, sw, sh, dx, dy, dw, dh) { //brings the correct ratio, makes the image taller and fixes the errors. 
  var vertSquashRatio = detectVerticalSquash(img);
  ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh / vertSquashRatio);
 }
